version: "3.9"
# Optional ClickHouse analytics sidecar
# Usage: docker compose -f docker-compose.yml -f docker-compose.clickhouse.yml up
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: qlab_clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: qlab
      CLICKHOUSE_USER: qlab
      CLICKHOUSE_PASSWORD: qlab_secret
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
