# Zero-Knowledge Circuit Obfuscation.
# When enabled, Q-Lab uploads resource/noise metadata and salted hashes, but
# does not upload raw QASM. This protects proprietary circuit IP while keeping
# depth, gate-count, and noise analysis available.
zk_qco = false
zk_qco_salt = ""
