# Q-Lab inside a company network, with no internet access.
# See README.md in this folder. Run from this folder: docker compose up -d
#
# Postgres, the API, the web app, and Caddy serving HTTPS with the company's own certificate.
# The images come from the bundle; nothing is fetched from the internet at any point.
name: qlab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh first}
      POSTGRES_DB: qlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: qlab-backend:offline
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://qlab:${POSTGRES_PASSWORD}@db/qlab
      QLAB_SECRET_KEY: ${QLAB_SECRET_KEY:?run setup.sh first}
      QLAB_APP_URL: https://${SITE_ADDRESS}
      CORS_ORIGINS: https://${SITE_ADDRESS}
      ENVIRONMENT: production
      QLAB_OWNER_EMAIL: ${QLAB_OWNER_EMAIL:-}
      # Inside a company network the AI model, mail and chat servers are internal: let Q-Lab call
      # them. (A shared hosted instance keeps this off; see backend/app/outbound.py.)
      QLAB_ALLOW_PRIVATE_URLS: "1"
      # Optional internal mail server (email confirmation, password resets).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: qlab-frontend:offline
    restart: unless-stopped
    environment:
      QLAB_API_URL: http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "${QLAB_HTTPS_PORT:-443}:443"
      - "${QLAB_HTTP_PORT:-80}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
      - caddy-data:/data

volumes:
  pgdata:
  caddy-data:
