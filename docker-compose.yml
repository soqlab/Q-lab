services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlab_app
    environment:
      DATABASE_URL: postgresql+psycopg://qlab:qlab@postgres:5432/qlab
      QLAB_API_KEYS: ${QLAB_API_KEYS:-dev-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QLAB_INSIGHT_MODEL: ${QLAB_INSIGHT_MODEL:-claude-haiku-4-5-20251001}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: qlab_timescaledb
    environment:
      POSTGRES_USER: qlab
      POSTGRES_PASSWORD: qlab
      POSTGRES_DB: qlab
    ports:
      - "5432:5432"
    volumes:
      - qlab_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: qlab_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qlab
      MINIO_ROOT_PASSWORD: qlab12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qlab_minio:/data

volumes:
  qlab_pgdata:
  qlab_minio:
