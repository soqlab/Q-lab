version: 2
updates:
  # Backend: pinned in backend/requirements.txt, so updates arrive as reviewable pull requests.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /qlab_sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The SDK's lower bounds (qiskit>=1.0, ipython>=7.0) are what users can install, not pins:
    # only raise one when a new release falls outside it.
    versioning-strategy: increase-if-necessary

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node the dashboard runs on (node:20 in frontend/Dockerfile and CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
