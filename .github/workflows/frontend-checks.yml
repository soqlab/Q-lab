name: Frontend Checks

on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (exactly what package-lock.json pins)
        run: npm ci
      - name: Generate route types (next-env.d.ts imports them)
        run: npx next typegen
      - name: Type check (may not add errors; see .typecheck-baseline)
        run: npm run typecheck
      - name: Lint (may not add errors; see .lint-baseline)
        run: npm run lint:ci
      - name: Production build
        run: npm run build
