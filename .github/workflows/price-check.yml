name: Provider Price Check

# Every cost Q-Lab shows comes from backend/app/provider_prices.json. Providers change their
# prices without telling us, so once a week this reads each provider's public pricing page and
# compares it with the table. A changed price fails the job with an ::error naming the entry;
# a page whose layout no longer matches its extractor is a ::warning (that entry was NOT checked).
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:
  pull_request:
    paths: ['backend/app/provider_prices.json', 'scripts/check_prices.py', '.github/workflows/price-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: nothing to install.
      - name: Compare the price table with the providers' pages
        run: python scripts/check_prices.py
