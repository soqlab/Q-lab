name: Backend Tests

on:
  push:
    paths: ['backend/**', 'scripts/check_prices.py', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'scripts/check_prices.py', '.github/workflows/backend-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway key for the test run only.
      QLAB_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      QLAB_TELEMETRY: "off"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        run: pytest tests -q --cov=app --cov-fail-under=75 --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - name: Core tracking path coverage
        # Ingest, run storage, read/compare, auth and run visibility. Raise the floor as tests are added.
        run: >-
          coverage report --fail-under=90
          --include="app/main.py,app/deps.py,app/run_scope.py,app/health_score.py,app/analytics.py,app/events.py,app/auth.py"
