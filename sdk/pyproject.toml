[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlab-sdk"
version = "0.1.0"
description = "Python SDK for the Q-Lab quantum experiment tracker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yasseen Nandally", email = "yasseennandally@gmail.com" }]
keywords = ["quantum", "qiskit", "experiment", "tracking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.urls]
Homepage = "https://soqlab.com/products/q-lab/"
Repository = "https://github.com/yasseennandally/Q-lab"

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qlab*"]
