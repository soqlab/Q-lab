[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qlab-sdk"
version = "0.1.0"
description = "Python SDK for the Q-Lab quantum experiment tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qlab*"]
