# One Render service runs all of Q-Lab. For separate backend and frontend services,
# use deploy/render-split.yaml instead (see deploy/README.md).
services:
  - type: web
    name: qlab-backend
    runtime: docker
    # Site and API in one container (deploy/render-single). The service keeps its name, so the
    # qlab-backend.onrender.com address the SDK posts to and the data disk stay the same.
    dockerfilePath: ./deploy/render-single/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/qlab-sqlite.db
      - key: QLAB_SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: QLAB_APP_URL
        value: https://qlab.soqlab.com
      # Sign-in is passkeys only: no password is set, reset or accepted (see SELF_HOSTING.md).
      - key: QLAB_PASSKEYS_ONLY
        value: "true"
      # Sign in with SOQLAB (backend/app/routers/soqlab_id.py): off until all three are set.
      # Issuer https://id.soqlab.com; register https://qlab.soqlab.com/soqlab-callback there.
      - key: QLAB_SOQLAB_ID_ISSUER
        sync: false
      - key: QLAB_SOQLAB_ID_CLIENT_ID
        sync: false
      - key: QLAB_SOQLAB_ID_CLIENT_SECRET
        sync: false
    healthCheckPath: /health
    disk:
      name: qlab-data
      mountPath: /app/data
      sizeGB: 10
